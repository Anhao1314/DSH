# 团队角色清单 —— 唯一事实源（single source of truth）。
#
# 改这里，然后运行（默认 dry-run，只打印将写入的差异）：
#   node dsh-workbench/scripts/render-team.mjs            # 预览 + 一致性检查
#   node dsh-workbench/scripts/render-team.mjs --write    # 应用
#   node dsh-workbench/scripts/render-team.mjs --check    # 只校验（漂移则退出码 1）
#   node dsh-workbench/scripts/render-team.mjs --print    # 人可读角色表
#
# 生成物（不要手改）：
#   dsh-home/.agent-presets/team-lead/agent.cordis.yml 的 token-policy / roles 标记区
#   dsh-home/team-roles.patch.yml（整文件）
#   dsh-home/AGENTS.md 的 team-policy 标记块
#   dsh-home/settings.yaml 的 agent-default-model.reasoningEffort（跟随 leadEffort）

version: 1

preset:
  id: team-lead
  name: 团队Lead模式

model:
  provider: deepseek
  model: deepseek-flash
  # 模型档位必须在 settings.yaml 的路由里声明（生成器会校验）。默认用 V4.1 Flash：
  # 官方称其质量/成本/速度全面优于 V4 Pro，且 2026-09-14 起 V4 Pro 的请求也转由它承接；
  # 同窗口内的 V4 Pro 仍可在设置里手动选择。
  # Lead 的思考强度；档位必须在 settings.yaml 的路由里声明（生成器会校验）。
  # medium 是省 token 的日常档位，够日常协同；难任务临时抬到 high，max 留给最难。
  leadEffort: medium

context:
  # 上下文压缩：1M 窗口不再等到 80% 才压缩；压完只保留 20k 近期上下文。
  compaction:
    thresholdRatio: 0.2
    retainTokens: 20000
  # 工具结果剪枝：大输出一旦进入上下文，之后每一步都会重发，所以收紧上限。
  pruning:
    thresholdChars: 4096
    headChars: 2048
    tailChars: 512

review:
  # 复核口径：l3-and-risky = 仅 L3 / 高风险 / 结果可疑时调用 delegate_reviewer。
  policy: l3-and-risky

roles:
  - id: coder
    toolName: delegate_coder
    title: Coder
    purpose: 实现最小正确改动并自测
    effort: low
    maxTokens: 32768
    maxDepth: 1
    backgroundMode: one-shot
    # 每步都会重发的工具 schema，能不给就不给；世界模型与文件系统保留。
    # 名字必须是运行时真实存在的全局工具：认不出的名字会让 tools.restrict()
    # 直接抛错、整条委派路径不可用（生成器按 KNOWN_TOOLS 拦截拼写错误）。
    toolDeny:
      - web_search
      - web_fetch
      - subagent_fork
      - subagent_codex
      - delegate_coder
      - delegate_reviewer
    report:
      - what changed
      - commands run + outcome
      - residual risk
    persona: |
      You are the Coder. Implement exactly the delegated task with minimal,
      correct changes. Run the relevant command/check when useful. If the task
      names an artifact/output directory, create it if needed and write EVERY
      final deliverable file into that exact absolute path (keep working edits
      where they belong, but place finished deliverables there); report the
      exact file paths written. Do not review architecture and do not spawn
      other agents.

  - id: reviewer
    toolName: delegate_reviewer
    title: Reviewer
    purpose: 只读独立复核，给出 pass/issues 与证据
    effort: high
    maxTokens: 32768
    maxDepth: 1
    backgroundMode: one-shot
    # 只读复核：deny 名单同 coder，外加写入工具。
    toolDeny:
      - write
      - edit
      - web_search
      - web_fetch
      - subagent_fork
      - subagent_codex
      - delegate_coder
      - delegate_reviewer
    report:
      - verdict (pass | issues)
      - evidence (commands + output summary)
      - issues with exact locations
    persona: |
      You are the Reviewer. Independently verify the delegated work by reading
      files and running read-only checks/tests. Never modify or implement.
